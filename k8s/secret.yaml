# ==============================================================================
#  SECRET TEMPLATE — Fill in real base64-encoded values before applying.
#  NEVER commit this file with real values to git.
#  Use: echo -n "your_value" | base64  to encode each field.
#
#  For production, use Sealed Secrets or external-secrets-operator instead of
#  committing plaintext secrets even in base64 form.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: airevrecovery
  labels:
    app.kubernetes.io/name: ai-revenue-recovery
type: Opaque
data:
  # echo -n "your_gemini_api_key" | base64
  GEMINI_API_KEY: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  # echo -n "your_groq_api_key" | base64
  GROQ_API_KEY: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  # echo -n "postgresql://user:pass@host/db?sslmode=require" | base64
  DATABASE_URL: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  # echo -n "rzp_live_XXXX" | base64
  RAZORPAY_KEY_ID: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  # echo -n "your_razorpay_secret" | base64
  RAZORPAY_KEY_SECRET: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  # echo -n "your_webhook_secret" | base64
  RAZORPAY_WEBHOOK_SECRET: "REPLACE_WITH_BASE64_ENCODED_VALUE"
