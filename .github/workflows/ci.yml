name: CI — Lint, Test & Build

on:
  push:
    branches: ["main", "dev", "feature/**"]
  pull_request:
    branches: ["main"]

# Cancel any in-progress run for the same branch to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  go-test:
    name: Go API — vet + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go-api/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test (with race detector)
        run: go test ./... -race -count=1 -v
        env:
          # Tests run without a real DB — handlers_test.go uses an in-memory Fiber app
          DATABASE_URL: ""
          RAZORPAY_WEBHOOK_SECRET: "test_secret_for_ci"

  # ─────────────────────────────────────────────────────────────────────────────
  python-test:
    name: Python ML Services — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest test_services.py -v --tb=short
        env:
          # Tests use mocked Groq client — no real API key needed
          GROQ_API_KEY: "gsk_test_placeholder_for_ci"

  # ─────────────────────────────────────────────────────────────────────────────
  dashboard-test:
    name: React Dashboard — lint + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test -- --run

      - name: Build check (vite)
        run: npm run build
